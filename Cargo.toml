[package]
name = "ultron-disassemble"
version = "3.0.0"
edition = "2021"
description = "ULTRON DISASSEMBLE v3.0 — Open-Source Multi-Architecture Binary Disassembler, Optimizing SSA Decompiler, Symbolic Z3 Solver, AI Decompiler & MCP Server in Rust"
license = "MIT"

[[bin]]
name = "ultron-disassemble-rs"
path = "src/main.rs"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
goblin = "0.8"
capstone = "0.12"
clap = { version = "4", features = ["derive"] }
libloading = "0.8"
hex = "0.4"
anyhow = "1"
tower-http = { version = "0.5", features = ["cors"] }
